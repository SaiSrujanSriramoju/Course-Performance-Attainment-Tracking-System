<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University of Hyderabad | Faculty Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Transparent top bar -->
  <div class="navbar">
    <div class="nav-left">
      <img src="uoh_logo.png" alt="University of Hyderabad Logo" class="nav-logo">
      <h1>University of Hyderabad</h1>
    </div>
  </div>

  <!-- Faculty Login Card -->
  <div class="login-card">
    <img src="uoh_logo.png" alt="University Logo" class="logo">
    <h2>Faculty Login Portal</h2>

    <form id="loginForm">
      <input type="text" id="facultyId" placeholder="Faculty ID" required>
      <input type="password" id="password" placeholder="Password" required>

      <button type="submit">Login</button>
    </form>

    <!-- Error message -->
    <p id="loginError" style="color: #ffdddd; background:#b40000; display:none; padding:6px; border-radius:6px; margin-top:10px;">
      Invalid Faculty ID or Password
    </p>

    <p style="margin-top:15px; color:#ffffffaa;">
      Authorized access for University Faculty Members only
    </p>
  </div>

  <!-- Footer -->
  <footer>
    © 2025 University of Hyderabad | All Rights Reserved
  </footer>

  <!-- Login JS -->
  <script>
      document.getElementById("loginForm").addEventListener("submit", function (e) {
          e.preventDefault();

          const id = document.getElementById("facultyId").value.trim();
          const pwd = document.getElementById("password").value.trim();

          // TEMPORARY CREDENTIALS (modify as needed)
          const validId = "faculty123";
          const validPass = "uoh2025";

          if (id === validId && pwd === validPass) {
              // Save login session
              localStorage.setItem("facultyLoggedIn", "true");

              // Redirect to dashboard
              window.location.href = "../faculty_ui/dashboard.html";
          } else {
              document.getElementById("loginError").style.display = "block";
          }
      });
  </script>

</body>
</html>
