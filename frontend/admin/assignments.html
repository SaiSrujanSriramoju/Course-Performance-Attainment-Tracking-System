<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Faculty | Admin Panel</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="sidebar.css">

  <!-- Prevent unauthorized access (Admin-only) -->
  <script>
    (async () => {
      try {
        const response = await fetch("http://localhost:5000/api/session", { credentials: "include" });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.authenticated || result.role !== "admin") {
          window.location.href = "../login/index.html";
        }
      } catch (err) {
        window.location.href = "../login/index.html";
      }
    })();
  </script>
</head>
<body>

  <!-- Sidebar: admin navigation -->
  <aside class="sidebar">
    <div class="logo-section">
      <img src="/faculty/uoh_logo.png" alt="UoH Logo">
      <h2>Admin Panel</h2>
    </div>

    <nav>
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="courses.html">📘 Courses</a>
      <a href="faculty.html">👨‍🏫 Faculty</a>
      <a href="assignments.html" class="active">🧩 Assignments</a>
      <a href="reports.html">📊 Reports</a>
      <a href="#" class="logout" onclick="logout()">🚪 Logout</a>
    </nav>
  </aside>

  <!-- Main Content: assignment management -->
  <main class="content">

    <!-- Page header -->
    <header>
      <h1>Assign Faculty to Course</h1>
      <p class="dept">Link faculty members with courses</p>
    </header>

    <!-- Assignment form -->
    <section class="form-card">
      <form id="assignmentForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="courseSelect">Course</label>
            <select id="courseSelect" required></select>
          </div>
          <div class="form-group">
            <label for="facultySelect">Faculty</label>
            <select id="facultySelect" required></select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-green">Assign</button>
        </div>
      </form>
    </section>

    <!-- Assignment list table -->
    <section class="data-section">
      <h2>Assignments</h2>
      <table>
        <thead>
          <tr>
            <th>Course Code</th>
            <th>Course Name</th>
            <th>Faculty</th>
            <th>Department</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="assignmentTableBody"></tbody>
      </table>
    </section>

    <!-- Footer -->
    <footer>
      © 2025 University of Hyderabad | Admin Portal
    </footer>

  </main>

<script>
/* ---------------------- LOGOUT ---------------------- */
async function logout() {
  try {
    await fetch(`${API_BASE}/logout`, { method: "POST", credentials: "include" });
  } finally {
    window.location.href = "../login/index.html";
  }
}

/* ---------------------- ASSIGNMENT STATE ---------------------- */
const API_BASE = "http://localhost:5000/api";
const courseSelect = document.getElementById("courseSelect");
const facultySelect = document.getElementById("facultySelect");
const assignmentTableBody = document.getElementById("assignmentTableBody");

let adminCourses = [];
let adminFaculty = [];
let adminAssignments = [];

function populateDropdowns() {
    courseSelect.innerHTML = "";
    facultySelect.innerHTML = "";

    if (!adminCourses.length) {
        courseSelect.innerHTML = `<option value="">No courses available</option>`;
    } else {
        adminCourses.forEach(c => {
            const opt = document.createElement("option");
        opt.value = c.course_id;
        opt.textContent = `${c.course_code} - ${c.course_name}`;
            courseSelect.appendChild(opt);
        });
    }

    if (!adminFaculty.length) {
        facultySelect.innerHTML = `<option value="">No faculty available</option>`;
    } else {
        adminFaculty.forEach(f => {
            const opt = document.createElement("option");
        opt.value = f.faculty_id;
        opt.textContent = `${f.name} (${f.faculty_id})`;
            facultySelect.appendChild(opt);
        });
    }
}

function renderAssignments() {
    assignmentTableBody.innerHTML = "";

    if (!adminAssignments.length) {
        assignmentTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No assignments created yet.</td></tr>`;
        return;
    }

    adminAssignments.forEach((a, idx) => {
        const row = document.createElement("tr");
        row.innerHTML = `
        <td>${a.course_code}</td>
        <td>${a.course_name}</td>
        <td>${a.faculty_name}</td>
        <td>${a.department}</td>
          <td>
            <div class="table-actions">
              <button class="btn btn-red" onclick="deleteAssignment(${idx})">Delete</button>
            </div>
          </td>
        `;
        assignmentTableBody.appendChild(row);
    });
}

  async function deleteAssignment(index) {
    if (!confirm("Remove this assignment?")) return;

    const assignment = adminAssignments[index];
    try {
      const response = await fetch(`${API_BASE}/assignments/${assignment.id}`, {
        method: "DELETE",
        credentials: "include"
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.success === false) {
        const message = result.message || "Failed to delete assignment";
        alert(message);
        return;
      }
      await fetchAssignments();
    } catch (err) {
      alert("Failed to connect to the server");
    }
}

const assignmentForm = document.getElementById("assignmentForm");
assignmentForm.addEventListener("submit", async (e) => {
    e.preventDefault();

  const courseId = courseSelect.value;
  const facultyId = facultySelect.value;

  if (!courseId || !facultyId) {
        alert("Please select both course and faculty");
        return;
    }

  try {
    const existing = adminAssignments.find(a => String(a.course_id) === String(courseId));
    if (existing) {
      const removeResponse = await fetch(`${API_BASE}/assignments/${existing.id}`, {
        method: "DELETE",
        credentials: "include"
      });
      const removeResult = await removeResponse.json().catch(() => ({}));
      if (!removeResponse.ok || removeResult.success === false) {
        const message = removeResult.message || "Failed to replace assignment";
        alert(message);
        return;
      }
    }

    const response = await fetch(`${API_BASE}/assign`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({
        course_id: courseId,
        faculty_id: facultyId
      })
    });

    const result = await response.json().catch(() => ({}));
    if (!response.ok || result.success === false) {
      const message = result.message || "Failed to create assignment";
      alert(message);
      return;
    }

    await fetchAssignments();
  } catch (err) {
    alert("Failed to connect to the server");
  }
});

async function fetchCourses() {
  const response = await fetch(`${API_BASE}/courses`, { credentials: "include" });
  const result = await response.json();
  if (!response.ok || result.success === false) {
    const message = result.message || "Failed to load courses";
    throw new Error(message);
  }
  adminCourses = result.courses || [];
}

async function fetchFaculty() {
  const response = await fetch(`${API_BASE}/faculty`, { credentials: "include" });
  const result = await response.json();
  if (!response.ok || result.success === false) {
    const message = result.message || "Failed to load faculty";
    throw new Error(message);
  }
  adminFaculty = result.faculty || [];
}

async function fetchAssignments() {
  try {
    const response = await fetch(`${API_BASE}/assignments`, { credentials: "include" });
    const result = await response.json();
    if (!response.ok || result.success === false) {
      const message = result.message || "Failed to load assignments";
      alert(message);
      return;
    }
    adminAssignments = result.assignments || [];
    renderAssignments();
  } catch (err) {
    alert("Failed to connect to the server");
  }
}

async function initAssignments() {
  try {
    await Promise.all([fetchCourses(), fetchFaculty()]);
    populateDropdowns();
    await fetchAssignments();
  } catch (err) {
    alert(err.message || "Failed to load assignment data");
  }
}

initAssignments();
</script>

</body>
</html>
