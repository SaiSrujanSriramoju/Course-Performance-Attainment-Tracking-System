<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Dashboard | University of Hyderabad</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="sidebar.css">


  <!-- Prevent unauthorized access -->
  <script>
    (async () => {
      try {
        const response = await fetch("http://localhost:5000/api/session", { credentials: "include" });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.authenticated || result.role !== "faculty") {
          window.location.href = "../login/index.html";
        }
      } catch (err) {
        window.location.href = "../login/index.html";
      }
    })();
  </script>
</head>

<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo-section">
      <img src="/faculty/uoh_logo.png" alt="UoH Logo">
      <h2>Faculty Panel</h2>
    </div>

    <nav>
      <a href="/faculty/dashboard" class = "active">🏠 Dashboard</a>
      <a href="/courses/courses.html">📘 Courses</a>
      <a href="/reports/reports.html">📊 Reports</a>
      <a href="#" class="logout" onclick="logout()">🚪 Logout</a>
    </nav>
  </aside>


  <!-- Main Content -->
  <main class="content">
    
    <header>
      <h1>Welcome, Faculty Member</h1>
      <p class="dept">Department of Computer Science</p>
    </header>

    <!-- ONLY ONE CARD LEFT -->
    <section class="cards">
      <div class="card" id="coursesAssignedCard">
        <h3>Courses Assigned</h3>
        <p id="coursesCount">0</p>
      </div>
    </section>

    <!-- Course Performance Summary -->
    <section class="data-section">
      <h2>Course Performance Summary</h2>

      <table id="summaryTable">
        <thead>
          <tr>
            <th>Course</th>
            <th>Batch</th>
            <th>Average (Tot)</th>
            <th>% Above Threshold</th>
            <th>Attainment Level</th>
          </tr>
        </thead>

        <tbody id="summaryBody">
        </tbody>
      </table>
    </section>

    <footer>
      © 2025 University of Hyderabad | Faculty Portal
    </footer>

  </main>


<script>
/* ---------------------- LOGOUT ---------------------- */
const API_BASE = "http://localhost:5000/api";

async function logout() {
  try {
    await fetch(`${API_BASE}/logout`, { method: "POST", credentials: "include" });
  } finally {
    window.location.href = "../login/index.html";
  }
}

/* ---------------------- LOAD DASHBOARD DATA ---------------------- */
async function loadDashboard() {
  const tbody = document.getElementById("summaryBody");
  tbody.innerHTML = "";

  let assignedCourses = [];
  try {
    const response = await fetch(`${API_BASE}/faculty/courses`, { credentials: "include" });
    const result = await response.json().catch(() => ({}));
    if (!response.ok || result.success === false) {
      throw new Error(result.message || "Failed to load courses");
    }
    assignedCourses = result.courses || [];
  } catch (err) {
    tbody.innerHTML = `
      <tr><td colspan="5" style="text-align:center;">Failed to load assigned courses.</td></tr>
    `;
    return;
  }

  document.getElementById("coursesCount").innerText = assignedCourses.length;

  if (assignedCourses.length === 0) {
    tbody.innerHTML = `
      <tr><td colspan="5" style="text-align:center;">No courses assigned yet.</td></tr>
    `;
    return;
  }

  const localCourses = JSON.parse(localStorage.getItem("courses")) || [];
  const findLocalIndex = (name) => localCourses.findIndex(c =>
    c.name && String(c.name).toLowerCase() === String(name || "").toLowerCase()
  );

  let anyData = false;

  assignedCourses.forEach((course) => {
    const localIndex = findLocalIndex(course.course_name);
    const reportKey = localIndex >= 0 ? "report_" + localIndex : null;
    const report = reportKey ? JSON.parse(localStorage.getItem(reportKey)) : null;

    if (report) { anyData = true; }

    const avg = report && report.summary && report.summary.avgs && Number.isFinite(report.summary.avgs["Tot"]) ? report.summary.avgs["Tot"].toFixed(2) : "—";
    const threshold = report && report.percentages && report.percentages["Tot"] !== undefined ? report.percentages["Tot"] + '%' : "—";

    let att = "—";
    if (report && report.attainment && report.attainment.levelsByCol) {
      const lvl = report.attainment.levelsByCol["Tot"];
      if (lvl !== undefined && lvl !== null) att = 'Level ' + lvl;
    }

    const displayName = course.course_name || (localIndex >= 0 ? localCourses[localIndex].name : "Course");
    const displayBatch = course.batch_name || (localIndex >= 0 ? localCourses[localIndex].batch : "—");

    const row = `
      <tr>
        <td>${displayName}</td>
        <td>${displayBatch}</td>
        <td>${avg}</td>
        <td>${threshold}</td>
        <td>${att}</td>
      </tr>
    `;
    tbody.innerHTML += row;
  });

  if (!anyData) {
    tbody.innerHTML = `
      <tr><td colspan="5" style="text-align:center;">No reports generated yet.</td></tr>
    `;
  }
}

loadDashboard();
</script>

</body>
</html>
