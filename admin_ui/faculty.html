<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Management | Admin Panel</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="sidebar.css">

  <!-- Prevent unauthorized access (Admin-only) -->
  <script>
    (async () => {
      try {
        const response = await fetch("http://localhost:5000/api/session", { credentials: "include" });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.authenticated || result.role !== "admin") {
          window.location.href = "../login/index.html";
        }
      } catch (err) {
        window.location.href = "../login/index.html";
      }
    })();
  </script>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo-section">
      <img src="/faculty/uoh_logo.png" alt="UoH Logo">
      <h2>Admin Panel</h2>
    </div>

    <nav>
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="courses.html">📘 Courses</a>
      <a href="faculty.html" class="active">👨‍🏫 Faculty</a>
      <a href="assignments.html">🧩 Assignments</a>
      <a href="reports.html">📊 Reports</a>
      <a href="#" class="logout" onclick="logout()">🚪 Logout</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="content">

    <header>
      <h1>Faculty Management</h1>
      <p class="dept">Add and manage faculty details</p>
    </header>

    <section class="form-card">
      <form id="facultyForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="facultyId">Faculty ID</label>
            <input type="text" id="facultyId" required>
          </div>
          <div class="form-group">
            <label for="facultyName">Faculty Name</label>
            <input type="text" id="facultyName" required>
          </div>
          <div class="form-group">
            <label for="facultyEmail">Email</label>
            <input type="email" id="facultyEmail" required>
          </div>
          <div class="form-group">
            <label for="facultyDept">Department</label>
            <input type="text" id="facultyDept" required>
          </div>
          <div class="form-group">
            <label for="facultyPassword">Password</label>
            <input type="password" id="facultyPassword" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-green" id="saveFacultyBtn">Save Faculty</button>
          <button type="button" class="btn btn-outline" id="resetFacultyBtn">Reset</button>
        </div>
      </form>
    </section>

    <section class="data-section">
      <h2>Faculty List</h2>
      <table>
        <thead>
          <tr>
            <th>Faculty ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="facultyTableBody"></tbody>
      </table>
    </section>

    <footer>
      © 2025 University of Hyderabad | Admin Portal
    </footer>

  </main>

<script>
/* ---------------------- LOGOUT ---------------------- */
async function logout() {
  try {
    await fetch(`${API_BASE}/logout`, { method: "POST", credentials: "include" });
  } finally {
    window.location.href = "../login/index.html";
  }
}

/* ---------------------- FACULTY STATE ---------------------- */
const API_BASE = "http://localhost:5000/api";
let adminFaculty = [];
let editingFacultyId = null;

const facultyForm = document.getElementById("facultyForm");
const facultyTableBody = document.getElementById("facultyTableBody");

const facultyIdInput = document.getElementById("facultyId");
const facultyPasswordInput = document.getElementById("facultyPassword");

function resetForm() {
    facultyForm.reset();
  editingFacultyId = null;
  facultyIdInput.disabled = false;
  facultyPasswordInput.required = true;
    document.getElementById("saveFacultyBtn").innerText = "Save Faculty";
}

function renderFaculty() {
    facultyTableBody.innerHTML = "";

    if (!adminFaculty.length) {
        facultyTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No faculty added yet.</td></tr>`;
        return;
    }

    adminFaculty.forEach((f, idx) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${f.faculty_id}</td>
          <td>${f.name}</td>
          <td>${f.email}</td>
          <td>${f.department}</td>
          <td>
            <div class="table-actions">
              <button class="btn btn-blue" onclick="editFaculty(${idx})">Edit</button>
              <button class="btn btn-red" onclick="deleteFaculty(${idx})">Delete</button>
            </div>
          </td>
        `;
        facultyTableBody.appendChild(row);
    });
}

facultyForm.addEventListener("submit", async (e) => {
    e.preventDefault();

  const facultyId = facultyIdInput.value.trim();
  const facultyName = document.getElementById("facultyName").value.trim();
  const facultyEmail = document.getElementById("facultyEmail").value.trim();
  const facultyDept = document.getElementById("facultyDept").value.trim();
  const facultyPassword = facultyPasswordInput.value.trim();

  if (!facultyId || !facultyName || !facultyEmail || !facultyDept) {
    alert("Please fill all fields");
    return;
  }

  try {
    if (!editingFacultyId && !facultyPassword) {
      alert("Please provide a password for new faculty");
      return;
    }

    if (editingFacultyId) {
      const response = await fetch(`${API_BASE}/faculty/${editingFacultyId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({
          name: facultyName,
          email: facultyEmail,
          department: facultyDept
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.success === false) {
        const message = result.message || "Failed to update faculty";
        alert(message);
        return;
      }
    } else {
      const response = await fetch(`${API_BASE}/faculty`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({
          faculty_id: facultyId,
          name: facultyName,
          email: facultyEmail,
          department: facultyDept,
          password: facultyPassword,
          first_login: 1
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.success === false) {
        const message = result.message || "Failed to create faculty";
        alert(message);
        return;
      }
    }

    await fetchFaculty();
    resetForm();
  } catch (err) {
    alert("Failed to connect to the server");
  }
});

function editFaculty(index) {
    const f = adminFaculty[index];
  facultyIdInput.value = f.faculty_id;
  document.getElementById("facultyName").value = f.name;
  document.getElementById("facultyEmail").value = f.email;
  document.getElementById("facultyDept").value = f.department;
  facultyPasswordInput.value = "";
  facultyPasswordInput.required = false;

  editingFacultyId = f.faculty_id;
  facultyIdInput.disabled = true;
    document.getElementById("saveFacultyBtn").innerText = "Update Faculty";
}

async function deleteFaculty(index) {
    if (!confirm("Delete this faculty member?")) return;

  const faculty = adminFaculty[index];
  try {
    const response = await fetch(`${API_BASE}/faculty/${faculty.faculty_id}`, {
      method: "DELETE",
      credentials: "include"
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok || result.success === false) {
      const message = result.message || "Failed to delete faculty";
      alert(message);
      return;
    }
    await fetchFaculty();
  } catch (err) {
    alert("Failed to connect to the server");
  }
}

document.getElementById("resetFacultyBtn").addEventListener("click", resetForm);

async function fetchFaculty() {
  try {
    const response = await fetch(`${API_BASE}/faculty`, { credentials: "include" });
    const result = await response.json();
    if (!response.ok || result.success === false) {
      const message = result.message || "Failed to load faculty";
      alert(message);
      return;
    }
    adminFaculty = result.faculty || [];
    renderFaculty();
  } catch (err) {
    alert("Failed to connect to the server");
  }
}

fetchFaculty();
</script>

</body>
</html>
