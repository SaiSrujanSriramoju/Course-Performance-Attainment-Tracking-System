<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reports | Faculty Dashboard</title>
    <link rel="stylesheet" href="reports.css">
    <link rel="stylesheet" href="../faculty_ui/sidebar.css">


    <!-- SheetJS for Excel parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- jsPDF + html2canvas -->
   
</head>

<body>

  <aside class="sidebar">
    <div class="logo-section">
      <img src="../faculty_ui/uoh_logo.png" alt="UoH Logo">
      <h2>Faculty Panel</h2>
    </div>

    <nav>
      <a href="../faculty_ui/dashboard.html">🏠 Dashboard</a>
      <a href="../courses_ui/courses.html">📘 Courses</a>
      <a href="../Reports_ui/reports.html">📊 Reports</a>
      <a href="#" class="logout" onclick="logout()">🚪 Logout</a>
    </nav>
  </aside>



    <!-- Main Content -->
    <main class="content">

        <header class="header-section">
            <h1>Reports</h1>
            <p class="subtle">Upload Excel files to generate complete course-wise attainment reports.</p>
        </header>

        <section id="coursesArea" class="courses-area">
            <!-- JS injects course cards here -->
        </section>

        <footer>© 2025 University of Hyderabad | Faculty Portal</footer>

    </main>

    <!-- Hidden Excel file input -->
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none">

    <!-- Threshold Modal -->
    <div id="thresholdModal" class="modal">
        <div class="modal-content">
            <h3>Enter Threshold Percentage (%)</h3>
            <input id="thresholdInput" type="number" min="0" max="100" placeholder="e.g., 40">
            <div class="modal-actions">
                <button id="thresholdOk" class="btn primary">OK</button>
                <button id="thresholdCancel" class="btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Attainment Level Modal -->
    <div id="attainmentModal" class="modal">
        <div class="modal-content attainment">
            <h3>Define Attainment Levels</h3>
            <label>Number of Levels:</label>
            <input id="levelsCount" type="number" min="1" max="10" value="3">
            <div id="levelsContainer"></div>

            <div class="modal-actions">
                <button id="attainmentOk" class="btn primary">Save Levels</button>
                <button id="attainmentCancel" class="btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Results Drawer -->
    <div id="resultsDrawer" class="drawer">
        <div class="drawer-content">
            <button id="closeDrawer" class="close-btn">✕</button>
            <div id="resultsContainer"></div>
        </div>
    </div>

    <script src="reports.js"></script>
</body>

</html>
