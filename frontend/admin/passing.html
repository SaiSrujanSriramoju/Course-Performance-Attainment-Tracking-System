<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passing Criteria | Admin Panel</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="sidebar.css">

  <!-- Prevent unauthorized access (Admin-only) -->
  <script>
    (async () => {
      try {
        const response = await fetch("http://localhost:5000/api/session", { credentials: "include" });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.authenticated || result.role !== "admin") {
          window.location.href = "../login/index.html";
        }
      } catch (err) {
        window.location.href = "../login/index.html";
      }
    })();
  </script>
</head>
<body>
  <main class="content">
    <header>
      <h1>Passing Criteria Removed</h1>
      <p class="dept">This feature has been removed from the Admin Panel.</p>
    </header>

    <section class="form-card">
      <p>Use Course Management to maintain course details.</p>
      <div class="form-actions">
        <a href="dashboard.html" class="btn btn-blue">Go to Dashboard</a>
        <a href="courses.html" class="btn btn-outline">Go to Courses</a>
      </div>
    </section>
  </main>

  <script>
    // Admin logic differs: passing criteria page removed
    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1500);
  </script>
</body>
</html>
