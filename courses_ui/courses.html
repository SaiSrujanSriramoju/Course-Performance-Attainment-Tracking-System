<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses | Faculty Portal</title>

<!-- COMBINED CSS (Dashboard style + Courses fixes) -->
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }

    body { display:flex; background:#f5f5f5; }

    /* SIDEBAR */
    .sidebar {
        width: 260px;
        background: #8b0f1e;
        height: 100vh;
        padding-top: 20px;
        color: white;
        position: fixed;
        left:0;
        top:0;
    }

    .logo-section {
        text-align:center;
        margin-bottom:20px;
    }

    .logo-section img {
        width: 120px;
        margin-bottom: 10px;
    }

    .logo-section h2 {
        font-size: 22px;
        font-weight: 700;
    }

    nav a {
        display:block;
        padding: 14px 25px;
        font-size: 18px;
        color:white;
        text-decoration:none;
        border-radius:6px;
        margin:6px 10px;
    }

    nav a:hover,
    nav a.active {
        background:#a10e1d;
    }

    nav a.logout {
        background:#c62828;
        margin-top:40px;
    }

    /* MAIN CONTENT */
    .content {
        margin-left:260px;
        width: calc(100% - 260px);
        padding: 30px 40px;
    }

    .page-title {
        font-size: 32px;
        font-weight: 700;
        color: #a10e1d;
        margin-bottom: 10px;
    }

    #addCourseBtn {
        background: #a10e1d;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        margin-bottom: 20px;
    }

    /* COURSE CARD */
    .course-card {
        background:white;
        padding:25px;
        border-radius:12px;
        box-shadow:0 2px 6px rgba(0,0,0,0.1);
        margin-top:20px;
        width:85%;
    }

    .btn {
        padding:8px 16px;
        border:none;
        border-radius:6px;
        cursor:pointer;
        font-weight:bold;
        margin-right:8px;
    }

    .btn-blue { background:#0d6efd; color:white; }
    .btn-red { background:#c62828; color:white; }
    .btn-green { background:#2e7d32; color:white; }

    /* MODAL */
    .modal {
        position: fixed;
        left:0; top:0;
        width:100%; height:100%;
        background: rgba(0,0,0,0.5);
        display:none;
        justify-content:center;
        align-items:center;
    }

    .modal-content {
        background:white;
        padding:25px;
        width:400px;
        border-radius:10px;
    }

    .modal-content h3 { margin-bottom:15px; }

    .modal-content input,
    .modal-content select {
        width:100%;
        padding:10px;
        margin-bottom:10px;
        border-radius:6px;
        border:1px solid #bbb;
    }

    .modal-buttons {
        text-align:right;
    }

</style>

<script>
    /* Redirect if not logged in */
    (async () => {
        try {
            const response = await fetch("http://localhost:5000/api/session", { credentials: "include" });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || !result.authenticated || result.role !== "faculty") {
                window.location.href = "../login/index.html";
            }
        } catch (err) {
            window.location.href = "../login/index.html";
        }
    })();
</script>

</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="logo-section">
        <img src="uoh_logo.png">
        <h2>Faculty Panel</h2>
    </div>

    <nav>
        <a href="/faculty/dashboard">🏠 Dashboard</a>
        <a href="/courses/courses.html" class="active">📘 Courses</a>
        <a href="/reports/reports.html">📊 Reports</a>
        <a href="#" class="logout" onclick="logout()">🚪 Logout</a>
    </nav>
</aside>

<!-- MAIN CONTENT -->
<main class="content">

    <h1 class="page-title">Course Management</h1>

    <button id="addCourseBtn">+ Add Course</button>

    <div id="coursesList"></div>

</main>

<!-- ADD/EDIT MODAL -->
<div id="courseModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Add Course</h3>

        <label>Course Name</label>
        <input type="text" id="courseName">

        <label>Batch</label>
        <select id="courseBatch">
            <option value="MCA">MCA</option>
            <option value="MTECH">MTECH</option>
            <option value="IMTECH">IMTECH</option>
        </select>

        <label>Start Year</label>
        <input type="number" id="startYear">

        <label>End Year</label>
        <input type="number" id="endYear">

        <label>Passing %</label>
        <input type="number" id="passingPercent">

        <label style="margin-top:6px">Attainment Levels (define ranges 0-100)</label>
        <label>Number of levels</label>
        <input type="number" id="levelsCount" min="1" max="6" value="3">
        <div id="levelsDef" style="max-height:200px;overflow:auto;margin-bottom:8px"></div>

        <div class="modal-buttons">
            <button class="btn btn-blue" id="saveCourse">Save</button>
            <button class="btn btn-red" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- CO-PO upload removed from UI; CO-PO mapping handled elsewhere -->

<!-- JAVASCRIPT (FULL LOGIC) -->
<script>

const API_BASE = "http://localhost:5000/api";

async function logout() {
    try {
        await fetch(`${API_BASE}/logout`, { method: "POST", credentials: "include" });
    } finally {
        window.location.href = "../login/index.html";
    }
}

let courses = [];
let editingIndex = -1;

function saveCourses() {
    localStorage.setItem("courses", JSON.stringify(courses));
    renderCourses();
}

function renderCourses() {
    const list = document.getElementById("coursesList");
    list.innerHTML = "";

    if (courses.length === 0) {
        list.innerHTML = "<p>No courses added yet.</p>";
        return;
    }

    courses.forEach((c, index) => {
        const card = document.createElement("div");
        card.className = "course-card";

        const batchYears = c.startYear && c.endYear ? `${c.startYear}-${c.endYear}` : "";
        const batchLabel = batchYears ? `${c.batch} ${batchYears}` : (c.batch || "—");
        const passLabel = c.passPercent !== undefined && c.passPercent !== "" ? c.passPercent : "—";

        card.innerHTML = `
            <h3>${c.name}</h3>
            <p><strong>Batch:</strong> ${batchLabel}</p>
            <p><strong>Passing %:</strong> ${passLabel}</p>
            ${c.attainmentLevels && c.attainmentLevels.length ? `<p><strong>Attainment Levels:</strong> ${c.attainmentLevels.length} levels</p>` : ''}

            <button class="btn btn-blue" onclick="editCourse(${index})">Edit</button>
            <button class="btn btn-red" onclick="deleteCourse(${index})">Delete</button>

            ${c.copoPdf ? `<p>CO-PO PDF: <a href="${c.copoPdf}" download>${c.copoPdfName}</a></p>` : ""}
        `;

        list.appendChild(card);
    });
}

document.getElementById("addCourseBtn").onclick = () => {
    alert("Courses are managed by Admin. Assigned courses appear here automatically.");
};

function openModal() {
    // build level rows for modal (defaults)
    buildCourseLevelRows();
    document.getElementById("courseModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("courseModal").style.display = "none";
}

document.getElementById("saveCourse").onclick = () => {
    const name = courseName.value.trim();
    const batch = courseBatch.value;
    const start = startYear.value;
    const end = endYear.value;
    const pass = passingPercent.value;

    if (!name || !start || !end || !pass) {
        alert("Please fill all fields");
        return;
    }

    // collect levels
    const lowEls = Array.from(document.querySelectorAll('#levelsDef .lvl-low'));
    const highEls = Array.from(document.querySelectorAll('#levelsDef .lvl-high'));
    const levelRows = lowEls.map((el, idx) => ({ level: idx+1, low: Number(el.value), high: Number(highEls[idx].value) }));

    // basic validation for levels: numbers present, 0<=low<=high<=100 and non-overlapping
    let prevHigh = -1;
    for (const lr of levelRows) {
        if (!Number.isFinite(lr.low) || !Number.isFinite(lr.high)) { alert('Fill all level ranges'); return; }
        if (lr.low < 0 || lr.high > 100 || lr.low > lr.high) { alert('Level ranges must be between 0 and 100 and low ≤ high'); return; }
        if (lr.low <= prevHigh) { alert('Level ranges must be non-overlapping and increasing'); return; }
        prevHigh = lr.high;
    }

    const courseObj = {
        name,
        batch,
        startYear: start,
        endYear: end,
        passPercent: pass,
        attainmentLevels: levelRows,
        copoPdf: null,
        copoPdfName: null
    };

    if (editingIndex === -1) courses.push(courseObj);
    else courses[editingIndex] = courseObj;

    saveCourses();
    closeModal();
};

function editCourse(i) {
    alert("Courses are managed by Admin. You can view assigned courses here.");
}

function deleteCourse(i) {
    alert("Courses are managed by Admin. You can view assigned courses here.");
}

// Build level definition rows inside the modal. If `prefill` is provided,
// it should be an array of {level,low,high} objects to populate the inputs.
function buildCourseLevelRows(prefill) {
    const container = document.getElementById('levelsDef');
    container.innerHTML = '';
    const n = Math.max(1, Math.min(6, Number(document.getElementById('levelsCount').value) || 3));
    for (let i = 1; i <= n; i++) {
        const div = document.createElement('div');
        div.style.display = 'flex';
        div.style.gap = '8px';
        div.style.marginBottom = '6px';
        const lowVal = prefill && prefill[i-1] ? prefill[i-1].low : '';
        const highVal = prefill && prefill[i-1] ? prefill[i-1].high : '';
        div.innerHTML = `<div style="width:60px">L${i}</div><input type="number" class="lvl-low" placeholder="Low" min="0" max="100" value="${lowVal}"><input type="number" class="lvl-high" placeholder="High" min="0" max="100" value="${highVal}">`;
        container.appendChild(div);
    }
}

document.getElementById('levelsCount').addEventListener('change', () => buildCourseLevelRows());

// CO-PO upload removed: function removed from UI to simplify workflow

async function fetchAssignedCourses() {
    const response = await fetch(`${API_BASE}/faculty/courses`, { credentials: "include" });
    const result = await response.json().catch(() => ({}));
    if (!response.ok || result.success === false) {
        const message = result.message || "Failed to load assigned courses";
        throw new Error(message);
    }
    return result.courses || [];
}

async function initCourses() {
    try {
        const assigned = await fetchAssignedCourses();
        courses = assigned.map((c) => ({
            name: c.course_name,
            batch: c.batch_name || "",
            startYear: "",
            endYear: "",
            passPercent: c.passing_marks,
            attainmentLevels: [],
            copoPdf: null,
            copoPdfName: null
        }));

        saveCourses();
    } catch (err) {
        const list = document.getElementById("coursesList");
        list.innerHTML = `<p>${err.message || "Failed to load courses"}</p>`;
    }
}

initCourses();

</script>

</body>
</html>
