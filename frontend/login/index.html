<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University of Hyderabad | Faculty Login</title>
  <link rel="stylesheet" href="/login/style.css">
</head>

<body>

  <!-- Transparent top bar with branding -->
  <div class="navbar">
    <div class="nav-left">
      <img src="/faculty/uoh_logo.png" alt="University of Hyderabad Logo" class="nav-logo">
      <h1>University of Hyderabad</h1>
    </div>
  </div>

  <!-- Faculty login card and form -->
  <div class="login-card">
    <img src="/faculty/uoh_logo.png" alt="University Logo" class="logo">
    <h2>Faculty Login Portal</h2>

    <form id="loginForm">
      <input type="text" id="userId" placeholder="User ID" required>
      <input type="password" id="password" placeholder="Password" required>

      <button type="submit">Login</button>
    </form>

    <!-- Error message shown on failed login -->
    <p id="loginError" style="color: #ffdddd; background:#b40000; display:none; padding:6px; border-radius:6px; margin-top:10px;">
      Invalid User ID or Password
    </p>

    <p style="margin-top:15px; color:#ffffffaa;">
      Authorized access for University Faculty Members only
    </p>
  </div>

  <!-- Footer -->
  <footer>
    © 2025 University of Hyderabad | All Rights Reserved
  </footer>

  <!-- Login JS: enforce base URL and call the API -->
    <script>
        if (window.location.port !== "5000") {
          window.location.href = "http://localhost:5000/login";
        }

      const API_BASE = "http://localhost:5000/api";
      const APP_BASE = API_BASE.replace("/api", "");

      document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const id = document.getElementById("userId").value.trim();
        const pwd = document.getElementById("password").value.trim();
        const errorEl = document.getElementById("loginError");
        errorEl.style.display = "none";

        try {
          const response = await fetch(`${API_BASE}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ user_id: id, password: pwd })
          });

          const result = await response.json().catch(() => ({}));
          if (!response.ok || result.status !== "success") {
            errorEl.style.display = "block";
            return;
          }

            if (result.role === "admin") {
              window.location.href = `${APP_BASE}/admin/dashboard`;
            return;
          }

            if (result.role === "faculty") {
              window.location.href = `${APP_BASE}/faculty/dashboard`;
            return;
          }

          errorEl.style.display = "block";
        } catch (err) {
          errorEl.style.display = "block";
        }
      });
    </script>

</body>
</html>
